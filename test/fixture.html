<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>detent test fixture</title>
    <style>
      body { margin: 0; font: 16px system-ui; }
      .slider { width: 200px; height: 40px; background: #ddd; margin: 20px; }
      .pip { position: fixed; left: 0; top: 0; width: 100px; height: 60px; background: #333; translate: calc(var(--x, 0) * 1px) calc(var(--y, 0) * 1px); }
      .sec { height: 70vh; border-top: 1px solid #000; }
      .lab { position: absolute; left: 300px; top: 100px; display: grid; gap: 20px; }
      .card { width: 300px; height: 160px; background: #bbb; translate: calc(var(--x, 0) * 1px) calc(var(--y, 0) * 1px); }
      .list { width: 300px; height: 200px; overflow: auto; background: #eee; }
      .list p { height: 40px; margin: 0; }
      .hold { width: 200px; height: 48px; }
      .box { width: 160px; height: 160px; background: #999; margin: 8px; }
      .mover { position: absolute; left: 0; top: 400px; width: 40px; height: 40px; background: #555; }
    </style>
  </head>
  <body>
    <div class="slider" id="slider" aria-label="Volume"></div>
    <div class="slider" id="loop" aria-label="Hour"></div>
    <div class="pip" id="pip" aria-label="Video"></div>
    <div class="lab">
      <div class="card" id="card"><button type="button" id="inside">Open</button></div>
      <div class="list" id="list"></div>
      <button type="button" class="hold" id="hold">Delete</button>
      <div class="box" id="cube" aria-label="Dice"></div>
      <div class="box" id="table" aria-label="Kettle"></div>
    </div>
    <div class="mover" id="mover"></div>
    <div class="mover" id="thumb" style="left: 600px; top: 500px; width: 20px; height: 20px"></div>
    <div id="scene-zone" hidden><div id="scene-target" style="margin-top: 1000px; height: 600px"></div><div style="height: 2000px"></div></div>
    <main id="page" hidden>
      <section class="sec" data-mark id="a"><h2>A</h2><a href="#c" id="toc">To C</a></section>
      <section class="sec" data-mark="strong" id="b"><h2>B</h2></section>
      <section class="sec" data-mark id="c"><h2>C</h2></section>
      <section class="sec" data-mark id="d"><h2>D</h2></section>
    </main>
    <script type="module">
      import { detent, detent2d, detent3d, detentScroll, detentThrow, detentPull, detentHold, animate, timeline, frame, frameBudget, scrollScene, morph } from '/src/index.ts'
      Object.assign(window, { morph, animate, timeline, frame, frameBudget, scrollScene, detentScroll, mover: document.getElementById('mover') })
      // Playwright cannot hide a tab, so the test sets document.hidden and sends the event itself.
      // A scene over a tall page: 0 to 1 as #scene-target passes, with labels at a third and at the end.
      window.makeScene = (o = {}) => {
        document.getElementById('scene-zone').hidden = false
        document.querySelectorAll('.slider, .pip, .lab, .mover').forEach((n) => (n.hidden = true))
        window.box = { v: 0 }
        window.tl = timeline({ paused: true }).add(box, { to: { v: 300 }, duration: 300, ease: 'linear' }, 0).label('third', 100).label('end', 300)
        window.scene = scrollScene(tl, { target: document.getElementById('scene-target'), start: 'top bottom', end: 'bottom top', ...o })
      }
      window.rect = (el = mover) => {
        const r = el.getBoundingClientRect()
        return [r.left, r.top, r.width, r.height].map((n) => Math.round(n * 10) / 10)
      }
      window.nextFrame = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)))
      window.setHidden = (hidden) => {
        Object.defineProperty(document, 'hidden', { value: hidden, configurable: true })
        document.dispatchEvent(new Event('visibilitychange'))
      }
      const log = (window.log = [])
      const on = (el, type) => el.addEventListener(type, (e) => log.push([el.id, type, e.detail]))
      for (const id of ['slider', 'loop', 'pip']) for (const t of ['detent:change', 'detent2d:change']) on(document.getElementById(id), t)
      const count = (window.count = { input: 0 })
      document.getElementById('slider').addEventListener('detent:input', () => count.input++)
      window.T = {
        slider: (o = {}) => (window.s = detent(document.getElementById('slider'), { min: 0, max: 100, step: 10, marks: [0, 50, 100], ...o })),
        loop: () => (window.l = detent(document.getElementById('loop'), { loop: true, count: 24, value: 23, size: 10 })),
        pip: (o = {}) => (window.p = detent2d(document.getElementById('pip'), { points: 'corners', cssVar: ['--x', '--y'], ...o })),
        scroll: (o = {}) => {
          document.getElementById('page').hidden = false
          document.querySelectorAll('.slider, .pip').forEach((n) => (n.hidden = true))
          window.scrollLog = { input: 0, change: [] }
          window.sc = detentScroll({ onInput: () => scrollLog.input++, onChange: (i) => scrollLog.change.push(i), ...o })
        },
        // A touch event with a given number of fingers still down.
        touch: (type, fingers) => {
          const e = new Event(type, { bubbles: true })
          Object.defineProperty(e, 'touches', { value: { length: fingers } })
          window.dispatchEvent(e)
        },
      }
      document.getElementById('list').innerHTML = Array.from({ length: 30 }, (_, i) => `<p>Row ${i + 1}</p>`).join('')
      window.buzz = []
      navigator.vibrate = (ms) => (buzz.push(ms), true)
      addEventListener('pointerdown', (e) => (window.lastPointer = e.pointerId), true)
      window.ev = []
      const listen = (id, types) => types.forEach((t) => document.getElementById(id).addEventListener(t, (e) => ev.push([t, e.detail])))
      listen('card', ['detentthrow:throw'])
      listen('list', ['detentpull:arm', 'detentpull:pull'])
      listen('hold', ['detenthold:tap', 'detenthold:confirm', 'detenthold:cancel'])
      window.seen = (type) => ev.filter((e) => e[0] === type).length
      document.getElementById('inside').addEventListener('click', () => ev.push(['inside:click']))
      Object.assign(T, {
        throw: (o = {}) => (window.t = detentThrow(document.getElementById('card'), { cssVar: ['--x', '--y'], ...o })),
        pull: (o = {}) => (window.pl = detentPull(document.getElementById('list'), { cssVar: '--pull', ...o })),
        hold: (o = {}) => (window.h = detentHold(document.getElementById('hold'), { cssVar: '--progress', ...o })),
        cube: (o = {}) => (window.c3 = detent3d(document.getElementById('cube'), { faces: 'cube', cssVar: ['--yaw', '--pitch'], ...o })),
        table: (o = {}) => (window.t3 = detent3d(document.getElementById('table'), { faces: 'turntable', ...o })),
      })
      listen('cube', ['detent3d:change'])
      listen('table', ['detent3d:change'])
      window.detentScrollEmpty = () => detentScroll({ marks: [] })
      window.ready = true
    </script>
  </body>
</html>
