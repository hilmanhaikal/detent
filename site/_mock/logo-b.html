<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>detent logo B</title>
    <link rel="icon" href="./logo/favicon.svg" />
    <style>
      body { margin: 0; padding: 40px 20px; background: #dde6eb; font: 15px/20px ui-monospace, monospace; color: #33658a; }
      main { max-width: 1000px; margin: 0 auto; display: grid; gap: 30px; }
      .big { width: min(100%, 720px); }
      .row { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
      .tile { padding: 20px 24px; border: 1px solid #86bbd8; }
      .dark { background: #2f4858; border-color: #2f4858; }
      .tile img { display: block; }
      .w30 { height: 30px; } .w16 { height: 16px; }
      .i { width: 96px; } .i32 { width: 32px; } .i16 { width: 16px; }
    </style>
  </head>
  <body>
    <main>
      <p>Logo B: the d holds a ball seated in a notch cut into its bowl, like a ball detent.</p>
      <img class="big" src="./logo/detent-wordmark.svg" alt="detent" />
      <div class="row">
        <div class="tile"><img class="w30" src="./logo/detent-wordmark.svg" alt="detent" /></div>
        <div class="tile dark"><img class="w30" src="./logo/detent-wordmark-light.svg" alt="detent" /></div>
        <div class="tile"><img class="w16" src="./logo/detent-wordmark.svg" alt="detent" /></div>
      </div>
      <div class="row">
        <div class="tile"><img class="i" src="./logo/detent-icon.svg" alt="detent icon" /></div>
        <div class="tile dark"><img class="i" src="./logo/detent-icon-light.svg" alt="detent icon" /></div>
        <div class="tile"><img class="i" src="./logo/favicon.svg" alt="favicon" /></div>
        <div class="tile"><img class="i32" src="./logo/favicon.svg" alt="favicon 32" /></div>
        <div class="tile"><img class="i16" src="./logo/favicon.svg" alt="favicon 16" /></div>
      </div>
    </main>
  </body>
</html>
